[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elenchus"
version = "0.1.0"
description = "Elenchus — the cross-examination. The model is the suspect: local bill/receipt audit where deterministic code checks the model's own arithmetic."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27"]

[project.scripts]
elenchus = "elenchus.cli:main"

[tool.setuptools.packages.find]
include = ["elenchus*"]
